21 之前，补一条仅表达时序的边。", "manual_review": false}, {"from": "E1", "to": "E4", "reason": "子图桥接：E1 → E4 为跨连通分量最小跨度对，仅表达时序，不表达因果。", "manual_review": false}, {"from": "E1", "to": "E8", "reason": "子图桥接：E1 → E8 为跨连通分量最小跨度对，仅表达时序，不表达因果。", "manual_review": false}, {"from": "E1", "to": "E12", "reason": "子图桥接：E1 → E12 为跨连通分量最小跨度对，仅表达时序，不表达因果。", "manual_review": false}];var _pyEvents=[{"id": "E1", "text": "1972年，时任美国总统理查德·尼克松访问中国。"}, {"id": "E2", "text": "1972年，尼克松在访华期间与毛泽东、周恩来等中国领导人会面。"}, {"id": "E3", "text": "尼克松访华并会见中国领导人后，美方采取“一个中国政策”，并认知到海峡两岸同属“一个中国”。"}, {"id": "E4", "text": "1978年底，美国总统吉米·卡特宣布美国将于1979年1月1日与台湾地区断绝外交关系，并与中华人民共和国建交。"}, {"id": "E5", "text": "美国计划于1979年1月1日与台湾地区断绝外交关系。"}, {"id": "E6", "text": "美国计划于1979年1月1日与中华人民共和国建立外交关系。"}, {"id": "E7", "text": "自1979年起，美国与台湾地区元首从未公开见面或直接通话，候任美国总统也会避免与台湾地区领导人直接通话。"}, {"id": "E8", "text": "美国与台湾地区断交后，美国国会通过《与台湾关系法》。"}, {"id": "E9", "text": "《与台湾关系法》要求美国向台湾提供维持防御能力的武器。"}, {"id": "E10", "text": "自2009年开始，奥巴马政府批准总额多达140亿美元的对台军售项目。"}, {"id": "E11", "text": "中华人民共和国对奥巴马政府批准对台军售项目表示抗议。"}, {"id": "E12", "text": "2016年11月8日，唐纳德·特朗普和迈克·彭斯在2016年美国总统选举中，当选为新任美国总统和副总统。"}, {"id": "E13", "text": "2016年美国总统选举结束后，蔡英文政府通过佛讷居中协助和驻美国台北经济文化代表处接触，与特朗普阵营高层建立沟通管道。"}, {"id": "E14", "text": "蔡英文政府将安排蔡英文与特朗普通话设定为对特朗普阵营沟通的第一目标。"}, {"id": "E15", "text": "2016年12月2日，美国总统当选人唐纳德·特朗普与蔡英文进行了约10分钟的直接越洋通话。"}, {"id": "E16", "text": "通话历时10多分钟，双方针对政治、经济、安全及亚洲印太区域情势交换意见。"}, {"id": "E17", "text": "这是史上首次美国候任总统与台湾地区领导人直接进行通话。"}, {"id": "E18", "text": "台湾地区领导人致电特朗普，祝贺其赢得美国总统选举。"}, {"id": "E19", "text": "北美东部时区12月2日下午7时44分，特朗普在Twitter上公开表示台湾地区领导人当天致电祝贺其赢得总统选举。"}, {"id": "E20", "text": "特朗普政权交接团队发布新闻稿，公布特朗普与蔡英文等4名国家元首通话的相关资讯，并以“The President of Taiwan”称呼蔡英文。"}, {"id": "E21", "text": "12月2日上午8时30分，台湾地区领导人办公室证实特朗普与蔡英文通话的消息。"}, {"id": "E22", "text": "台湾地区领导人办公室公布特朗普与蔡英文10多分钟通话的谈话内容。"}, {"id": "E23", "text": "美国副总统当选人迈克·彭斯称，特朗普接到台湾地区领导人的礼貌致电并接受对方祝贺。"}, {"id": "E24", "text": "12月4日，彭斯接受采访时表示，特朗普与台湾地区领导人的通话不意味着美国对台湾或“一个中国”政策会有转变。"}, {"id": "E25", "text": "12月6日，特朗普交接团队顾问叶望辉访问台湾。"}, {"id": "E26", "text": "叶望辉访台期间拜会蔡英文、吴钊燮、李大维等台湾地区高层人士。"}, {"id": "E27", "text": "叶望辉计划在访问台湾后于12月11日转往日本访问。"}, {"id": "E28", "text": "12月11日，特朗普接受专访时表示自己在与蔡英文通电前一两个小时才得知此事，并质疑为何美国要被“一个中国”政策绑住。"}, {"id": "E29", "text": "12月12日，中国外交部发言人耿爽表示中方已严正关切，并强调“一个中国”政策是中美关系基础，要求候任美国政府理解台湾议题的敏感性。"}, {"id": "E30", "text": "2017年1月8日，蔡英文出访中美洲四个“邦交国”并过境美国休斯敦。"}, {"id": "E31", "text": "休斯敦特朗普团队发言人迪托表示，蔡英文过境期间特朗普本人和政权交接团队成员都不会与其会晤。"}, {"id": "E32", "text": "1月14日，特朗普在《华尔街日报》访问中表示包括“一个中国”在内的一切都还在协商，并称在北京当局改善人民币及贸易等问题前不会恪守“一个中国”政策。"}, {"id": "E33", "text": "1月15日，白宫办公厅主任普里巴斯表示特朗普团队没有计划改变一中政策，但如果中国不在贸易、南海及区域事务上与美方合作，一中政策仍可讨论。"}, {"id": "E34", "text": "2月9日傍晚，美国总统特朗普与中国大陆领导人习近平进行电话对谈。"}, {"id": "E35", "text": "白宫新闻稿称，应习近平要求，特朗普同意遵循美国的“一中”政策。"}, {"id": "E36", "text": "3月13日，美国国务院代理亚太助卿董云裳表示，美国的一个中国政策基于美中三公报及《与台湾关系法》，并已在川习通话中再次得到确认。"}, {"id": "E37", "text": "4月27日，蔡英文接受路透社专访时表示，不排除未来有机会与特朗普总统本人通电话。"}, {"id": "E38", "text": "4月28日，美国国务院东亚局发言人崔‧葛瑞丝表示，特朗普政府决心全面执行《与台湾关系法》条文，向台湾提供防卫所需物资与服务。"}, {"id": "E39", "text": "6月30日，美国国务院发言人希瑟·诺尔特证实，国防合作安全局已通知国会拟向台湾军售包括多种导弹在内的7项军备。"}, {"id": "E40", "text": "美国国防合作安全局通知国会，将向台湾出售包括多种导弹在内的7项军备。"}, {"id": "E41", "text": "2018年3月16日，美国总统特朗普签署参、众两院通过的《与台湾交往法》。"}];var _origGraphMeta={"doc_id": "D001", "doc_name": "D001 特朗普当选后蔡英文通话——打破37年惯例（2016.12）.txt"};var _graphJsonPath="D:\\code\\PycharmProjects\\pytorch\\causal_inference\\output\\doc_results\\D001\\graph.json";var _savePort=7760;var _pyDocText="特蔡通话（英语：Trump-Tsai call）是指2016年12月2日，蔡英文自台湾致电美国总统当选人唐纳德·特朗普，祝贺其当选新任总统。通话历时10多分钟，双方针对政治、经济、安全及亚洲印太区域情势交换意见，特朗普并多次于网站及推特发表看法。这是史上首次美国候任总统与台湾地区领导人直接进行通话，在国际上引发热议。\n1972年，时任美国总统理查德·尼克松访问中国，与中国共产党中央委员会主席毛泽东和中国国务院总理周恩来等人会面后，采取“一个中国政策”，美方“认知”到海峡两岸同属“一个中国”。1978年底，美国总统吉米·卡特宣布美国将于1979年1月1日与台湾地区断绝外交关系，同时与中华人民共和国建交。虽然美国总统罗纳德·里根在竞选时曾表示要与台湾地区恢复外交关系，但当他上台后并无实际作为。因此自1979年起，两国元首从未公开见面或直接通话。候任美国总统也会避免与台湾地区领导人直接通话。\n美国与台湾地区断交后，美国国会随即压倒性通过《与台湾关系法》，两党均有议员呼吁美国应尽速改变不正常的关系、卸任官员、媒体、学者、人民（未达连署标准），采行符合现状的“一中一台”政策，基于现实与道德考量，重新承认自由民主体制的稳定盟友与贸易伙伴台湾是中国的一部分，建立或恢复正式外交关系，重建“共同防御条约”，积极支持台湾以国家身份完整参与联合国等国际组织，以维护美国与台湾双方之利益。美国从里根政府时期持续与高度自治的台湾维持非官方关系，在经贸政策与军事合作上有着密切交流。《与台湾关系法》及对台六项保证亦要求向台湾提供维持防御能力的武器，提出有关军事防御的承诺。自2009年开始，奥巴马政府虽然强调“一中政策”，且希望海峡两岸关系和平稳定发展，但亦批准多达140亿美元的对台军售项目，引起中华人民共和国的抗议。但长期以来美国对于海峡两岸关系政策的架构未有重大改变，仍基于国家利益，且以不同国家、区域乃至于全球进行考量，不仅限于双边或三边的单纯关系。2016年11月8日，唐纳德·特朗普和迈克·彭斯在2016年美国总统选举中，当选为新任美国总统和副总统。即将就职的美国总统当选人特朗普与其他国家元首的对话，但也数度引起争议。其中包括和日本首相安倍晋三会面，也和中共中央总书记兼中国大陆国家主席习近平、韩国总统朴槿惠等亚洲国家领导人通过电话。其中他邀请存在争议的菲律宾总统罗德里戈·杜特尔特在2017年访问白宫，并在与习近平通话时形容双方将共同建立最强大的关系。不过特朗普在竞选期间曾多次严厉批评中华人民共和国的经贸政策，并威胁往后将提高中华人民共和国进口商品的关税。\n相对地，特朗普过去较少提及对于台湾的政策，仅在选举造势时批评台湾抢走美国民众的工作机会，也曾批评美国不卖F-16 C/D战斗机给台湾。而在当选美国总统后，特朗普公开表示将退出《跨太平洋战略经济伙伴关系协议》、要求同盟国家承担更多军费支出，这让台湾等许多亚洲盟友对于特朗普政府往后的亚洲政策充满不确定感。不过特朗普幕僚随后向他简报台湾和海峡两岸关系议题，而所属的共和党也首次将自对于台湾的“六项保证”列入共和党党纲，幕僚团队亦有对台湾友善、反对中华人民共和国的成员。2016年美国总统选举结束后，蔡英文政府透过与台湾友好、属于特朗普竞选阵营的佛讷居中协助，经驻美国台北经济文化代表处接触，在蔡英文政府与特朗普阵营高层间建立沟通管道。其中第一目标便设定希望安排蔡英文能和特朗普通话，尽管双方沟通过程获得特朗普阵营的正面回应，提出通话要求的台湾地区领导人办公室方面仍对此极为谨慎且高度保密。\n由于特朗普尚未听取美国国务院提交的简报、也未选出新任美国国务卿，使外界推测他和蔡英文的沟通可能越过美国在台协会，直接双边接触。而当蔡英文因为在同年2月赠送“三只小猪”签名画给民主党候选人希拉里·克林顿，而面临国内政坛批评并质疑接触能力时，台湾地区领导人办公室考量正透过管道安排与特朗普通话，因而未能立即澄清。前台湾地区外事部门负责人程建人则认为假设曾经担任公职的希拉里当选，因为其知道事情处理方式而将不会直接通话，作法也不会有太大改变。\n另外CNN曾经报导通话是由与台湾关系非常友好的美国传统基金会研究员叶望辉居中促成，不过《华盛顿观察家报》致电向叶望辉求证时，后者予以否认。而叶望辉在以电子邮件答复政治新闻网站Politico提问时，表示美国总统或美国总统当选人本来就应该接听这类电话。\n当中担任经济幕僚的欧文加利福尼亚大学商学院教授彼得·纳瓦罗，便曾批评美国不应放任中华人民共和国打压台湾。前美国常驻联合国代表约翰·博尔顿也曾在2016年1月在《华尔街日报》撰文，主张美国应该借由台湾问题遏制中华人民共和国，做法包括邀请台湾地区领导人访问美国、最终恢复全面外交认可等。截至2016年12月1日，特朗普的外交研判团队尚未成形，美国国务院在特蔡通话前未提供给特朗普相关简报，传达美国的外交政策。在和蔡英文通话前，特朗普便已经安排与阿富汗总统阿什拉夫·加尼、菲律宾总统罗德里戈·杜特尔特及新加坡总理李显龙等3位国家元首通话。特朗普表示自己是在与蔡英文通电之前一、两个小时前才得知此事，台湾方面则说有关本次电话谈话相关的洽系过程及其他细节，一切都依据台美交往的惯例来办理。在经过交涉而确定时程后，同意由台湾方面致电，对方接通后再交由特朗普对话，就台美关系、及亚洲局势交换意见，通话约10分钟。其中蔡英文借由表达祝贺之意，并重申台湾是美国坚定的盟友，期待双方在政治、经济和安全层面进一步合作；特朗普则是向蔡英文重申美国对台湾的关系，并期待美国新政府与台湾密切合作。\n2016年12月2日，《自由电子报》披露透过美方人士得知即将通话的消息，台湾地区领导人办公室发言人黄重谚表示没有相关消息，避免深夜通话出现意外。而在同日，前美国国务卿亨利·基辛格在与特朗普会面后前往中华人民共和国，不过此举之后遭疑为“协助消息传递”。到了晚上11时6分（北美东部时区12月2日上午10时6分），新任美国总统当选人唐纳德·特朗普和蔡英文直接越洋通话，谈话过程长达约10分钟，约在晚上11时18分结束。\n通话过程中，蔡英文由国家安全委员会秘书长吴钊燮、台湾地区外事部门负责人李大维、台湾地区领导人办公室秘书长刘建忻和台湾地区领导人办公室发言人黄重谚等人陪同，国家安全局等成员也在旁待命。蔡英文先是亲切且轻松地与特朗普相互问候，并代表台湾当局和民众，对于特朗普及其团队能在竞争激烈的选举中成功当选新任美国总统，表达相当敬佩与祝贺；同时她也祝福并深信后者在就任后，必定能有杰出的施政表现，特朗普也对蔡英文在2016年年初胜选表示祝贺。\n蔡英文接着提及台湾往后的施政重点和理念，将是促进经济发展和强化国防，让民众享有更好的生活与安全保障。双方在电话中还简短讨论台湾和美国间的经济、政治与安全关系等议题，希望加强双方更紧密的合作关系。而针对往后台湾与美国关系及亚洲区域情势交换意见，蔡英文表示期盼能够强化双边互动与联系，同时也希望美国能持续支持台湾参与和贡献国际议题的机会。北美东部时区12月2日下午7时44分，特朗普Twitter上表示：“台湾地区领导人今天打电话给我，祝贺我赢得总统选举。谢谢！”（The President of Taiwan CALLED ME today to wish me congratulations on winning the Presidency. Thank you!），随即引起新闻媒体不断转载。在特朗普交接团队证实消息后，台湾地区领导人办公室也立即公布两人谈话内容。\n面对质疑与批评，特朗普再度在Twitter发表贴文为自己辩护，以反讽语气提到：“很有意思，美国出售台湾数十亿美元军备，但我却不应该接一通祝贺电话。”（Interesting how the U.S. sells Taiwan billions of dollars of military equipment but I should not accept a congratulatory call.）数个小时后，特朗普在Facebook重申相同内容。\n特朗普政权交接团队亦发布新闻稿，公布与蔡英文等4名国家元首双方通话内容等相关资讯，并以“台湾地区领导人”（The President of Taiwan）称呼蔡英文；但随着首次直接电话沟通、及美国方面愿意公布通话内容，因而引起国际关注后，新闻稿中提及蔡英文的部分则是遭到删除，仅剩下特朗普与其他国家元首的通话内容，不过并未确定竞选团队是否受到中华人民共和国的压力而撤除新闻。\n面对外界质疑，特朗普仍然认为应当接通贺电。特朗普幕僚凯莉安·康威为其辩护，强调美国政策没有改变，该通电话无法代表政策制定或说明。台湾地区领导人办公室幕僚在蔡英文与特朗普顺利通话后，一开始保持低调态度，而未预料到特朗普直接在Twitter公开承认与蔡英文通话。12月2日上午8时30分，台湾地区领导人办公室才证实通话消息，并公布两人10多分钟的谈话内容。不过在当天下午，蔡英文前往台中市出席中部科学工业园区公共艺术装置剪彩仪式等公开活动时，对于新闻媒体询问而未说明此事。\n相对地，台湾地区领导人办公室发言人黄重谚在12月3日召开记者会，表示双方通话主要是基于台湾与美国关系的期盼，没有必要以窄化方式看待，并期盼能用正面看待；他并提到当台湾对外处境相当辛苦时，特别需要众人一致对外。对于中华人民共和国的反应，他强调良好的海峡两岸关系与对美国关系，对于台湾一样重要；他并表示两者能够同时发展，不会出现冲突或互相违背，对于区域的和平稳定也有重要帮助，都是台湾当局努力经营的目标。\n台湾地区大陆事务主管部门则强调台湾是中国的一部分，与美国存在长期友好关系，蔡英文祝贺特朗普且维系往后友好合作属于正常举动，中华人民共和国应该平常心看待。同时台湾当局重视与美国的关系和海峡两岸关系，致力维护台湾海峡区域的和平稳定发展，这也符合各方利益和国际社会的共同期待。同时感谢美国长期支持台湾推动务实政策。往后仍将坚持既定立场，确保国家最大利益与民众福祉；同时也呼吁中华人民共和国面对亚太地区的新形势，应该共同致力于展开良性的海峡两岸关系，创造有利于区域各方和平繁荣和安定发展的新局面。\n12月4日，美国副总统当选人迈克·彭斯接受乔治·斯蒂芬诺伯罗斯采访时，面对特朗普为何打破多年传统并直接通话的质问，表示特朗普是接到台湾地区领导人礼貌致电，并接受对方祝贺。而尽管斯蒂芬诺伯罗斯依照美国惯例使用“台湾地区领导人”（leader of Taiwan），不过彭斯仍自然提到“台湾地区领导人”（democratic elected president of Taiwan）。之后接受《与媒体见面》专访时，彭斯对于特朗普的通话是否有意打破美国长期的“一个中国”政策的疑问，再度强调仅是民主选举选出的蔡英文打电话向特朗普致贺，后者表达感谢之意，双方仅是礼貌性电话谈话，该通电话并不表示美国对于台湾、或是“一个中国”政策将有任何转变。\n彭斯在专访节目上三度使用“台湾地区领导人”称呼蔡英文。同时他对于中华人民共和国的抗议不以为意。他认为特朗普无意挑战美国外交政策体制派、中美关系外交建制派人士的做法，但也不预期特朗普或其顾问会针对这次事件而联系中华人民共和国政府，也不认为特朗普可能致电给习近平以缓和关系。他提到，贝拉克·奥巴马能与古巴的杀人独裁者交流、并被认为是英雄，不理解为什么特朗普与民主选出的台湾地区领导人通话，却成为新闻媒体的重大议题，他相信大部分美国民众与国家元首都能理解该次通话的意涵。2016年\n12月6日，特朗普交接团队的顾问叶望辉访问台湾，计划直到12月11日再转往日本访问。当中行程还安排拜会蔡英文、国家安全委员会秘书长吴钊燮和台湾地区外事部门负责人李大维等人，双方就未来台湾与美国关系展开进一步交流，台湾当局也希望透过叶望辉深入理解特朗普的海峡两岸关系与亚太地区政策。\n蔡英文政府团队在与特朗普团队有效互动后，拟安排在2017年访问中南美洲友邦尼加拉瓜，可能出席尼加拉瓜总统丹尼尔·奥尔特加连任就职典礼外，将争取在过境美国期间与下届政府人士互动的机会，以促进台湾与美国关系。民主进步党籍立法委员、身兼党内国际部主任的罗致政认为，这是在管道畅通情况下可以进行的安排。对于双方通话，他表示必定进行过适度评估准备，若政府只是自我设限而认定并不可能，将不会有这项结果。他并认为目前特朗普的态度和动作对于台湾有着相当大的善意，这是好的开始，往后值得观察其亚洲政策。他认为台湾应该评估往后与美国之间的合作议题，尽可能思考各种发展方向。尽管可能影响海峡两岸关系，但他认为中华人民共和国不须过度反应。\n12月11日，特朗普接受周日福斯新闻节目主持人华莱士专访时表示，自己是在与蔡英文通电之前一、两个小时前才得知此事。面对引发各方质疑美国是否改变“一个中国”政策，特朗普说：“我完全理解‘一个中国’政策；但我不懂的是，除非我们和中国达成一些协议──包括贸易──，否则为什么要被这个政策绑死？”并指出中国大陆在人民币政策、南海扩军、朝鲜问题保持不合作的态度。对于中国大陆方面的反应，特朗普回应：“我不希望中国对我发号施令，这通电话是打给我的（I don't want China dictating to me and this was a call put into me.）。我没有去打这通电话。并且这是一通电话，非常短的电话，说：祝贺你大选获胜，先生（Congratulations, sir, on the victory.）。一次很棒的通话，很短。为什么其他国家可以叫我不要接电话？老实说，如果我不接这通电话，就会非常失礼。”\n12月12日，中华人民共和国外交部发言人耿爽回应已经严正关切，并强调“一个中国”政策是中美关系基础，要求候任美国政府必须理解台湾议题的敏感性。同日台湾地区领导人办公室发言人黄重谚表示，不会评论美国总统当选人特朗普的谈话，但国家终极利益是自由民主的确保、国际关系有更多更好的参与，只要有助于这两层面，台湾都会是乐见的。\n12月31日，特朗普傍晚在佛州海湖庄园参加除夕庆祝活动前，和记者有简短对答。有记者问，如果台湾地区领导人要过境，你会和她会面吗？特朗普先反问记者，“过境这里？”记者随后补充，“是美国”。特朗普再追问想厘清，是美国还是海湖庄园所在地的棕榈滩？他随后接着说，“没有人向我提起这件事，我在1月20日（就职）前、将不会和任何人会面，因为就外交礼仪（Protocol）的观点来说，这有点不恰当，但我们再看看、再看看吧（But we'll see..We'll see）。”\n2017年\n1月8日，蔡英文出访中美洲四友邦，过境美国休斯敦，对此休斯敦特朗普团队发言人迪托（Jessica Ditto）在电邮中表示，蔡英文过境期间，不论是特朗普本人或政权交接团队成员，都不会与蔡英文会晤。然而蔡英文在抵达休斯敦的当天中午会见了联邦参、众议员，和休斯敦市长席维斯特·透纳会晤，并与特朗普新政府的外交国防团队共进午餐及会谈。\n1月14日，蔡英文在过境美国旧金山之际，与美国准总统特朗普阵营有所联系，据了解蔡英文与将担任白宫办公厅主任的普里巴斯通电话，不过台湾地区领导人办公室没有证实，仅说明台湾地区领导人与“几位美国友人”以电话交谈，基于跟美方的默契与对美国友人的尊重，不多做说明。同日特朗普在华尔街日报访问中表示，一切都还在协商，包括“一个中国”（Everything is under negotiation including One China），他在看到北京当局在人民币及贸易等方面做出改善之前，不会恪守“一个中国”政策（wouldn't commit to the \"one China\" policy）。中华人民共和国外交部发言人陆慷回应，一个中国原则是中美关系的政治基础，是不可谈判的，敦促美国有关方面认清台湾问题的高度敏感性，恪守美国两党历届政府作出的承诺，即奉行一个中国政策、遵守中美三个联合公报原则，妥善处理台湾问题，以免影响中美关系健康稳定发展和两国重要领域的合作。\n1月15日，普里巴斯接受美国广播公司节目《本周》访问指出，特朗普团队“没有计划改变一中政策”，他也说：“但是如果中国不上谈判桌，与美方就贸易、南海及该区域事务进行合作，一中政策当然尚待讨论。”\n2月10日，白宫新闻稿指出，美国总统特朗普与中国大陆领导人习近平在9日傍晚进行了一段长时间的电话对谈，讨论了许多议题，“应习近平要求，特朗普同意遵循我们（美国）的‘一中’政策”（President Trump agreed, at the request of President Xi, to honor our “one China” policy），白宫声明中还特别将“一中”加注引号。\n3月13日，美国国务院代理亚太助卿董云裳表示，美国的一个中国政策是基于美中三公报及与台湾关系法，1979年完成立法程序的与台湾关系法，提供美国人民与台湾人民之间一个活跃、强劲且承诺性的非官方关系，美国的一中政策可以回溯到基辛格时代，在川习电话中再次得到确认。\n4月6、7日，美国总统特朗普与中国大陆领导人习近平在美国佛罗里达州进行首次会晤，双方谈及朝鲜、贸易、南海等议题，但记者会内容与白宫声明皆未提及台湾与“一中政策”。\n4月27日，蔡英文接受路透社专访，被问到会与特朗普进一步对话时表示，她当然期待在重要的时刻、在关键的事情上面，能有机会跟美国政府有更直接的沟通，也不排除有机会跟特朗普总统本人能够通电话，但是这可能要看整个情势的需求跟美国政府在处理这个区域的事务上面的考量。另提到台湾对于战略上有意义的军购项目都不会排除，“F-35在战略上确实是一个有意义的项目”。\n4月28日，美国总统特朗普在白宫接受路透社访问时，提及他不想在北京展现帮忙遏止朝鲜之际，为中国大陆领导人习近平添麻烦。特朗普被问到台湾有意买F-35时说：“喔，我还没接到通知，我得想想这件事，我也得跟我们的人谈。他们（台湾政府）确实从我们这里买了很多装备。”同日美国国务院东亚局发言人崔‧葛瑞丝表示，特朗普政府决心全面执行《与台湾关系法》中的条文，也就是美国提供台湾防卫所需的物资与服务，让台湾维持足够的自我防御能力。\n5月23日，蔡英文会见共和党全国委员会共同主席裴杜奇（Bob Paduchik），重申台湾会持续扮演美国在区域安全可信赖的伙伴，为区域的繁荣与和平而努力，也请裴杜奇主席代她向特朗普总统、以及曾经多次访台的白宫办公厅主任普里巴斯致意。\n6月15日，美国国务卿提勒森表示，美、中对“一中政策”有不同解释，美方亦信守《与台湾关系法》履行所有对台承诺。\n6月30日，美国国务院发言人希瑟·诺尔特在新闻简报会上证实，国防合作安全局已通知国会将军售台湾包括多种导弹等7项军备。\n2018年\n3月16日，美国总统特朗普签署参、众两院通过的《与台湾交往法》。《泰晤士报》认为特朗普有意终结美国37年来对北京低声下气的“臣服外交”。\n法新社则指出特朗普与蔡英文通话的举动，可视为打破美国长年来的惯例。";var _pyManualReviewEdges=[];</script><script>

/* ── 候选节点面板 ───────────────────────────────────────────── */
function _showCandidatePanel(anchorId, role) {
    var allIds = network.body.data.nodes.getIds().map(String);
    var excluded = {};
    excluded[String(anchorId)] = true;
    if (role === 'source') {
        // anchor 是起点，选终点 B：B 不能是 anchor 的祖先（防环）且不能有 anchor→B（防重复）
        var anc = getAncestors(anchorId);
        Object.keys(anc).forEach(function(k) { excluded[k] = true; });
        _liveEdges().forEach(function(e) {
            if (String(e.from) === String(anchorId)) excluded[String(e.to)] = true;
        });
    } else {
        // anchor 是终点，选起点 A：A 不能是 anchor 的后代（防环）且不能有 A→anchor（防重复）
        var desc = getDescendants(anchorId);
        Object.keys(desc).forEach(function(k) { excluded[k] = true; });
        _liveEdges().forEach(function(e) {
            if (String(e.to) === String(anchorId)) excluded[String(e.from)] = true;
        });
    }
    var candidates = allIds.filter(function(id) { return !excluded[id]; });
    if (candidates.length === 0) {
        showToast('没有可新增的候选节点', 2000, '#555');
        _addEdge = null;
        return;
    }
    var title = role === 'source' ? '以该节点为起点，选择终点：' : '以该节点为终点，选择起点：';
    document.getElementById('candidate-title').textContent = title;
    var html = '';
    candidates.forEach(function(id) {
        var ev = (_pyEvents || []).find(function(e) { return e.id === id; });
        var label = ev ? (id + ': ' + ev.text) : id;
        html += '<div onclick="selectCandidate(\'' + id + '\')" '
              + 'style="padding:6px 10px;cursor:pointer;border-radius:4px;margin-bottom:3px;'
              + 'font-size:12px;background:#f0f7ff;border:1px solid #c5d8f0;" '
              + 'onmouseover="this.style.background=\'#dbeeff\'" '
              + 'onmouseout="this.style.background=\'#f0f7ff\'">'
              + _esc(label) + '</div>';
    });
    document.getElementById('candidate-body').innerHTML = html;
    document.getElementById('candidate-panel').style.display = 'flex';
}
function closeCandidatePanel() {
    var p = document.getElementById('candidate-panel');
    if (p) p.style.display = 'none';
    _addEdge = null;
}
function selectCandidate(candidateId) {
    if (!_addEdge) { closeCandidatePanel(); return; }
    var src = _addEdge.role === 'source' ? _addEdge.anchorId : candidateId;
    var tgt = _addEdge.role === 'target' ? _addEdge.anchorId : candidateId;
    closeCandidatePanel();
    _newEdgePair = {source: src, target: tgt};
    _showNewEdgeDlg(src, tgt);
}

/* ── 保存/下载 ─────────────────────────────────────────────── */
function _setUnsaved() {
    _hasUnsaved = true;
    var el = document.getElementById('save-status');
    if (el) { el.textContent = '有未保存的修改'; el.style.opacity = '1'; }
}
function _updateGraphInfo(data) {
    var causalCount = document.getElementById('causal-count');
    var temporalCount = document.getElementById('temporal-count');
    var titleEl = document.getElementById('doc-title');
    if (causalCount) causalCount.textContent = String((data.causal_edges || []).length);
    if (temporalCount) temporalCount.textContent = String((data.temporal_edges || []).length);
    if (titleEl && data.doc_name) {
        titleEl.textContent = String(data.doc_name).replace(/\.txt$/i, '');
    }
}
function _loadLatestGraph() {
    if (!_graphJsonPath) return Promise.resolve(false);
    var url = 'http://localhost:' + _savePort + '/load_graph?path=' + encodeURIComponent(_graphJsonPath) + '&_ts=' + Date.now();
    return fetch(url, {cache: 'no-store'}).then(function(r) {
        var ok = r.ok;
        return r.json().then(function(j) { return {ok: ok, body: j}; });
    }).then(function(res) {
        if (!res.ok || !res.body || !res.body.data) return false;
        _applyLoadedData(res.body.data);
        return true;
    }).catch(function() {
        return false;
    });
}
function _saveRequest(data) {
    return fetch('http://localhost:' + _savePort + '/save_graph', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path: _graphJsonPath, data: data}),
    }).then(function(r) {
        var ok = r.ok;
        return r.json().then(function(j) { return {ok: ok, body: j}; });
    });
}
function _waitForSaveServer(maxAttempts) {
    var attempts = 0;
    function probe() {
        attempts += 1;
        return _loadLatestGraph().then(function(ok) {
            if (ok || attempts >= maxAttempts) return ok;
            return _wait(500).then(probe);
        }).catch(function() {
            if (attempts >= maxAttempts) return false;
            return _wait(500).then(probe);
        });
    }
    return probe();
}
function _saveFallback(data, msg) {
    showToast(msg, 6000, '#c0392b');
    var el = document.getElementById('save-status');
    if (el) { el.textContent = '保存失败，修改尚未写入 graph.json'; el.style.opacity = '1'; }
}
function _handleSaveResponse(res, data) {
    if (res.ok && (!res.body || res.body.ok !== false)) {
        showToast('已保存并重载 ✓', 3000, '#27ae60');
        var el = document.getElementById('save-status');
        if (el) { el.textContent = ''; el.style.opacity = '0'; }
        _applyLoadedData(res.body.data || data);
        return true;
    }
    var err = (res.body && res.body.error) ? ('保存失败：' + res.body.error) : '保存失败';
    _saveFallback(data, err);
    return false;
}
function buildSaveData() {
    var causal = [], temporal = [];
    for (var eid in _edgeLookup) {
        if (_deletedEdges[eid]) continue;
        var e = _edgeLookup[eid];
        if (e.type === 'causal') {
            var d = {cause: e.from, effect: e.to, reason: e.reason};
            if (e.manualReview) d.manual_review = true;
            causal.push(d);
        } else {
            var d = {source: e.from, target: e.to, reason: e.reason};
            if (e.manualReview) d.manual_review = true;
            temporal.push(d);
        }
    }
    var evts = (_pyEvents || []).map(function(e) { return {event_id: e.id, text: e.text}; });
    return {
        doc_id: (_origGraphMeta || {}).doc_id || '',
        doc_name: (_origGraphMeta || {}).doc_name || '',
        doc_text: _pyDocText || '',
        events: evts, causal_edges: causal, temporal_edges: temporal,
        manual_review_edges: _pyManualReviewEdges || [],
    };
}
function saveGraph() {
    var data = buildSaveData();
    showToast('保存中…', 30000, '#555');
    _saveRequest(data).then(function(res) {
        _handleSaveResponse(res, data);
    }).catch(function() {
        showToast('本地保存服务暂未就绪，正在自动重试…', 4000, '#e67e22');
        _waitForSaveServer(6).then(function(ok) {
            if (!ok) {
                _saveFallback(data, '自动保存服务仍未就绪，未写入 graph.json');
                return;
            }
            showToast('本地保存服务已就绪，正在重试保存…', 4000, '#e67e22');
            _saveRequest(data).then(function(res) {
                _handleSaveResponse(res, data);
            }).catch(function() {
                _saveFallback(data, '自动重试保存失败，未写入 graph.json');
            });
        });
    });
}
function _applyLoadedData(data) {
    /* 用服务器返回的 graph.json 内容就地重建可视化，边恢复红/蓝色，状态全清零 */
    if (!data || typeof network === 'undefined') return;
    network.body.data.edges.clear();
    _edgeLookup = {};
    _deletedEdges = {};
    _manualEdits = {};
    _hasUnsaved = false;
    _pyCausal = (data.causal_edges || []).map(function(e) {
        return {from: e.cause, to: e.effect, reason: e.reason || '', manual_review: !!e.manual_review};
    });
    _pyTemporal = (data.temporal_edges || []).map(function(e) {
        return {from: e.source, to: e.target, reason: e.reason || '', manual_review: !!e.manual_review};
    });
    if (Array.isArray(data.events)) {
        _pyEvents = data.events.map(function(ev) { return {id: ev.event_id, text: ev.text || ''}; });
    }
    if (typeof data.doc_text === 'string') {
        _pyDocText = data.doc_text;
    }
    if (data.doc_id || data.doc_name) {
        _origGraphMeta = {
            doc_id: data.doc_id || ((_origGraphMeta || {}).doc_id || ''),
            doc_name: data.doc_name || ((_origGraphMeta || {}).doc_name || ''),
        };
    }
    _pyManualReviewEdges = Array.isArray(data.manual_review_edges) ? data.manual_review_edges : [];
    _pyCausal.forEach(function(e, i) {
        var eid = 'c' + i;
        var manualReview = !!e.manual_review;
        var style = _edgeStyle('causal', manualReview);
        network.body.data.edges.add([{
            id: eid, from: e.from, to: e.to, arrows: 'to',
            color: style.color,
            width: style.width, dashes: style.dashes, title: _edgeTitle(e.reason, manualReview),
        }]);
        _edgeLookup[eid] = {type:'causal', from:String(e.from), to:String(e.to), reason:e.reason, manualReview:manualReview};
    });
    _pyTemporal.forEach(function(e, i) {
        var eid = 't' + i;
        var manualReview = !!e.manual_review;
        var style = _edgeStyle('temporal', manualReview);
        network.body.data.edges.add([{
            id: eid, from: e.from, to: e.to, arrows: 'to',
            color: style.color,
            width: style.width, dashes: style.dashes, title: _edgeTitle(e.reason, manualReview),
        }]);
        _edgeLookup[eid] = {type:'temporal', from:String(e.from), to:String(e.to), reason:e.reason||'', manualReview:manualReview};
    });
    _updateGraphInfo(data);
    _renderEventPanel();
}
function downloadGraph(data) {
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'graph.json';
    a.click();
}
function showToast(msg, duration, bg) {
    var toast = document.getElementById('save-toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.background = bg || '#333';
    toast.style.display = 'block';
    toast.style.opacity = '1';
    if (toast._timer) clearTimeout(toast._timer);
    toast._timer = setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { toast.style.display = 'none'; }, 400);
    }, duration || 2500);
}

var _candDrag = null;
document.addEventListener('mousedown', function(e) {
    var handle = document.getElementById('candidate-drag-handle');
    if (!handle || !handle.contains(e.target)) return;
    if (e.button !== 0) return;
    var panel = document.getElementById('candidate-panel');
    if (!panel) return;
    var rect = panel.getBoundingClientRect();
    // 如果还在用百分比定位，先转换为具体像素坐标
    panel.style.top  = rect.top  + 'px';
    panel.style.left = rect.left + 'px';
    panel.style.marginLeft = '0';
    _candDrag = { startX: e.clientX, startY: e.clientY,
                  initLeft: rect.left, initTop: rect.top };
    e.preventDefault();
});
document.addEventListener('mousemove', function(e) {
    if (!_candDrag) return;
    var panel = document.getElementById('candidate-panel');
    if (!panel) return;
    panel.style.left = (_candDrag.initLeft + e.clientX - _candDrag.startX) + 'px';
    panel.style.top  = (_candDrag.initTop  + e.clientY - _candDrag.startY) + 'px';
});
document.addEventListener('mouseup', function(e) {

});
/* ── 初始化 ────────────────────────────────────────────────── */
window.addEventListener('load', function() {
    (_pyCausal || []).forEach(function(e, i) {
        _edgeLookup['c' + i] = {type:'causal', from:e.from, to:e.to, reason:e.reason, manualReview:!!e.manual_review};
    });
    (_pyTemporal || []).forEach(function(e, i) {
        _edgeLookup['t' + i] = {type:'temporal', from:e.from, to:e.to, reason:e.reason, manualReview:!!e.manual_review};
    });
    if (typeof network !== 'undefined') {
        network.on('click', function(params) {
            if (!_editMode) { closeAllMenus(); return; }
            closeEdgeMenu();
            closeNodeMenu();
            // 如果处于候选选择状态，任意点击画布空白处取消
            if (_addEdge && params.nodes.length === 0 && params.edges.length === 0) {
                closeCandidatePanel();
                return;
            }
            if (params.nodes.length > 0) {
                // 如果候选面板已展开，直接调 selectCandidate
                var panel = document.getElementById('candidate-panel');
                if (panel && panel.style.display !== 'none') {
                    selectCandidate(String(params.nodes[0]));
                } else {
                    showNodeMenu(params.nodes[0], params.pointer.DOM.x, params.pointer.DOM.y);
                }
            } else if (params.edges.length > 0) {
                if (document.getElementById('candidate-panel').style.display !== 'none') return;
                showEdgeMenu(params.edges[0], params.pointer.DOM.x, params.pointer.DOM.y);
            }
        });
    }
    _updateGraphInfo({
        doc_name: (_origGraphMeta || {}).doc_name || '',
        causal_edges: _pyCausal || [],
        temporal_edges: _pyTemporal || [],
    });
    _renderEventPanel();
